<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>House of Zonshine — Coming Soon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Raleway', sans-serif; overflow: hidden; }

    .hero {
      position: relative;
      width: 100%;
      height: 100vh;
      background: #2B1F1A;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, rgba(43,31,26,0.5) 0%, rgba(43,31,26,0.3) 50%, rgba(43,31,26,0.6) 100%);
      z-index: 1;
    }

    .content {
      position: relative;
      z-index: 2;
      text-align: center;
      color: #FBF8F3;
      max-width: 700px;
      padding: 2rem;
    }

    .name {
      font-size: 4.5rem;
      font-weight: 300;
      letter-spacing: 0.01em;
      margin-bottom: 1rem;
      line-height: 1.1;
    }

    .coming-soon {
      font-size: 2.2rem;
      font-weight: 400;
      letter-spacing: 0.02em;
      margin-bottom: 2.5rem;
      opacity: 0.95;
    }

    .cta-button {
      display: inline-block;
      background: #A9895A;
      color: #FBF8F3;
      padding: 1rem 2.5rem;
      border: none;
      border-radius: 4px;
      font-family: 'Raleway', sans-serif;
      font-size: 1rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    .cta-button:hover {
      background: #8f7047;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
    }

    @media (max-width: 768px) {
      .name { font-size: 2.8rem; }
      .coming-soon { font-size: 1.5rem; }
      .cta-button { padding: 0.8rem 2rem; font-size: 0.9rem; }
    }
  </style>
</head>
<body>
  <div class="hero">
    <video autoplay muted loop playsinline>
      <source src="videos/hero.mp4" type="video/mp4">
    </video>
    <div class="overlay"></div>
    <div class="content">
      <div class="name">House of Zonshine</div>
      <div class="coming-soon">Coming Soon</div>
      <a href="mailto:julia.zonshine@compass.com" class="cta-button">Get in Touch</a>
    </div>
  </div>
</body>
</html>
